<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกรายรับรายจ่าย</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome (CDN สำหรับ Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ซ่อน Scrollbar ของตารางให้ดูสะอาดตา */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Expense Tracker</h1>
                <p class="text-gray-500">ระบบบันทึกรายรับ-รายจ่าย</p>
            </div>
            <!-- สถานะการเชื่อมต่อ API -->
            <div id="api-status" class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-medium flex items-center">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> กำลังโหลดข้อมูล...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- คอลัมน์ซ้าย: ฟอร์มบันทึกข้อมูล -->
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-bold mb-4 border-b pb-2"><i class="fa-solid fa-plus-circle text-blue-500 mr-2"></i>บันทึกรายการใหม่</h2>
                
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ประเภท</label>
                        <select id="type" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <option value="รายจ่าย">รายจ่าย</option>
                            <option value="รายรับ">รายรับ</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label>
                        <select id="category" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <option value="อาหาร/เครื่องดื่ม">อาหาร/เครื่องดื่ม</option>
                            <option value="เดินทาง">เดินทาง</option>
                            <option value="ช้อปปิ้ง">ช้อปปิ้ง</option>
                            <option value="บิล/ค่าหย่อนใจ">บิล/ค่าหย่อนใจ</option>
                            <option value="เงินเดือน/รายได้">เงินเดือน/รายได้</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="amount" min="1" step="0.01" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="0.00">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ (Optional)</label>
                        <input type="text" id="note" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="ระบุรายละเอียดสั้นๆ">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">แนบสลิป (เฉพาะรูปภาพ)</label>
                        <input type="file" id="receipt" accept="image/*" class="w-full border border-gray-300 rounded-lg p-1.5 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 mt-4 flex justify-center items-center">
                        <span>บันทึกข้อมูล</span>
                    </button>
                    <!-- ข้อความแจ้งเตือนผลการบันทึก -->
                    <div id="formMessage" class="hidden text-sm text-center font-medium p-2 rounded mt-2"></div>
                </form>
            </div>

            <!-- คอลัมน์ขวา: Dashboard และ ประวัติ -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- ส่วนสรุปยอดและกราฟ -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <div>
                        <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i>สรุปรายจ่าย (หมวดหมู่)</h2>
                        <div class="relative h-64 w-full flex justify-center">
                            <!-- Canvas สำหรับวาด Donut Chart -->
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-4">
                        <!-- การ์ดสรุปยอด -->
                        <div class="bg-green-50 border border-green-100 p-4 rounded-xl">
                            <p class="text-sm text-green-600 font-medium">รายรับรวม</p>
                            <p class="text-2xl font-bold text-green-700" id="totalIncome">฿0.00</p>
                        </div>
                        <div class="bg-red-50 border border-red-100 p-4 rounded-xl">
                            <p class="text-sm text-red-600 font-medium">รายจ่ายรวม</p>
                            <p class="text-2xl font-bold text-red-700" id="totalExpense">฿0.00</p>
                        </div>
                        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl">
                            <p class="text-sm text-blue-600 font-medium">ยอดคงเหลือ</p>
                            <p class="text-2xl font-bold text-blue-700" id="balance">฿0.00</p>
                        </div>
                    </div>
                </div>

                <!-- ส่วนตารางประวัติ -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-clock-rotate-left text-gray-500 mr-2"></i>ประวัติรายการล่าสุด</h2>
                    <div class="overflow-x-auto no-scrollbar">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50 rounded-t-lg">
                                <tr>
                                    <th scope="col" class="px-4 py-3 rounded-tl-lg">วันที่</th>
                                    <th scope="col" class="px-4 py-3">ประเภท</th>
                                    <th scope="col" class="px-4 py-3">หมวดหมู่</th>
                                    <th scope="col" class="px-4 py-3">หมายเหตุ</th>
                                    <th scope="col" class="px-4 py-3 text-right">จำนวน (฿)</th>
                                    <th scope="col" class="px-4 py-3 text-center rounded-tr-lg">สลิป</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody" class="divide-y divide-gray-100">
                                <!-- ข้อมูลจะถูก render ตรงนี้โดย JS -->
                                <tr>
                                    <td colspan="6" class="px-4 py-8 text-center text-gray-400">กำลังโหลดข้อมูลประวัติ...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== สคริปต์การทำงาน (Vanilla JS) ===== -->
    <script>
        // ---------------------------------------------------------
        // 1. ตั้งค่า API (นำ Web App URL จาก Phase 3 มาใส่ตรงนี้)
        // ---------------------------------------------------------
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzEGFksYTTTzIxjg3vsnQvgJEy3-N_1pAIuro_MdNPxkrzfRVKxljIJYUBwjGWiZXT-Cw/exec'; // <--- เปลี่ยน URL ตรงนี้
        
        // ตัวแปรเก็บกราฟ
        let myChart = null;

        // ---------------------------------------------------------
        // 2. ฟังก์ชันโหลดข้อมูลและอัปเดตหน้าจอ (GET Request)
        // ---------------------------------------------------------
        async function loadDashboardData() {
            const statusBadge = document.getElementById('api-status');
            
            try {
                // เรียกใช้ GET Method ไปที่ Apps Script
                const response = await fetch(GAS_API_URL);
                const result = await response.json();

                if(result.status === 'success') {
                    statusBadge.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> เชื่อมต่อแล้ว';
                    statusBadge.className = 'px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium flex items-center';
                    
                    renderHistoryTable(result.data);
                    updateDashboardCardsAndChart(result.data);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> เชื่อมต่อล้มเหลว';
                statusBadge.className = 'px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-medium flex items-center cursor-pointer';
                // ถ้ายังไม่ได้ใส่ URL หรือรันแบบ Local ไฟล์ จะเตือนตรงนี้
                document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-red-500">ไม่สามารถโหลดข้อมูลได้ (ตรวจสอบ Web App URL)</td></tr>`;
            }
        }

        // ---------------------------------------------------------
        // 3. ฟังก์ชันคำนวณและวาดกราฟ (Chart.js)
        // ---------------------------------------------------------
        function updateDashboardCardsAndChart(data) {
            let totalIn = 0;
            let totalOut = 0;
            let expenseByCategory = {};

            // คำนวณยอดรวมและจัดกลุ่มหมวดหมู่รายจ่าย
            data.forEach(item => {
                const amt = parseFloat(item.amount) || 0;
                if(item.type === 'รายรับ') {
                    totalIn += amt;
                } else if(item.type === 'รายจ่าย') {
                    totalOut += amt;
                    // รวมยอดตามหมวดหมู่สำหรับทำกราฟ
                    expenseByCategory[item.category] = (expenseByCategory[item.category] || 0) + amt;
                }
            });

            // อัปเดตตัวเลขในการ์ด
            document.getElementById('totalIncome').innerText = `฿${totalIn.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            document.getElementById('totalExpense').innerText = `฿${totalOut.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            document.getElementById('balance').innerText = `฿${(totalIn - totalOut).toLocaleString('th-TH', {minimumFractionDigits: 2})}`;

            // เตรียมข้อมูลสำหรับ Chart.js
            const labels = Object.keys(expenseByCategory);
            const chartData = Object.values(expenseByCategory);

            // สีของแต่ละหมวดหมู่
            const backgroundColors = [
                '#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#6B7280'
            ];

            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            // ทำลายกราฟเก่า (ถ้ามี) ก่อนวาดใหม่
            if (myChart) { myChart.destroy(); }

            // ถ้ารายจ่ายเป็น 0 ให้แสดงกราฟว่างๆ
            if(chartData.length === 0) {
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: ['ไม่มีข้อมูลรายจ่าย'], datasets: [{ data: [1], backgroundColor: ['#E5E7EB'] }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { enabled: false } } }
                });
                return;
            }

            // สร้าง Donut Chart
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: backgroundColors,
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 12 } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) { label += ': '; }
                                    if (context.parsed !== null) {
                                        label += new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(context.parsed);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    cutout: '65%' // ความกลวงตรงกลาง (Donut)
                }
            });
        }

        // ---------------------------------------------------------
        // 4. ฟังก์ชัน Render ตารางประวัติ
        // ---------------------------------------------------------
        function renderHistoryTable(data) {
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-4 text-center text-gray-500">ยังไม่มีรายการบันทึก</td></tr>`;
                return;
            }

            // แสดงแค่ 10 รายการล่าสุด
            const recentData = data.slice(0, 10);

            recentData.forEach(item => {
                const dateObj = new Date(item.timestamp);
                const formattedDate = `${dateObj.toLocaleDateString('th-TH')} ${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')}`;
                
                const typeClass = item.type === 'รายรับ' ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50';
                const sign = item.type === 'รายรับ' ? '+' : '-';
                
                // เช็คว่ามีรูปสลิปไหม ถ้ามีให้สร้างลิงก์
                const receiptHtml = item.receipt_url 
                    ? `<a href="${item.receipt_url}" target="_blank" class="text-blue-500 hover:text-blue-700" title="ดูสลิป"><i class="fa-solid fa-image"></i></a>`
                    : `<span class="text-gray-300">-</span>`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-gray-500">${formattedDate}</td>
                    <td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 rounded text-xs font-medium ${typeClass}">${item.type}</span></td>
                    <td class="px-4 py-3 text-gray-700">${item.category}</td>
                    <td class="px-4 py-3 text-gray-500 text-xs">${item.note || '-'}</td>
                    <td class="px-4 py-3 text-right font-medium whitespace-nowrap ${item.type === 'รายรับ' ? 'text-green-600' : 'text-gray-800'}">${sign}${parseFloat(item.amount).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                    <td class="px-4 py-3 text-center">${receiptHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ---------------------------------------------------------
        // 5. ระบบบันทึกข้อมูล (POST Request) พร้อมแปลงรูปภาพ
        // ---------------------------------------------------------
        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('formMessage');
            
            // เปลี่ยนปุ่มเป็นสถานะ Loading (UX)
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังบันทึก...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            msgBox.className = 'hidden';

            try {
                // รวบรวมข้อมูลจากฟอร์ม
                const payload = {
                    type: document.getElementById('type').value,
                    category: document.getElementById('category').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    note: document.getElementById('note').value,
                    fileData: null,
                    fileName: null,
                    mimeType: null
                };

                // จัดการไฟล์รูปภาพ (ถ้ามี)
                const fileInput = document.getElementById('receipt');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    
                    // Client-Side Validation: จำกัดขนาดไฟล์ 2MB
                    if (file.size > 2 * 1024 * 1024) {
                        throw new Error("ขนาดไฟล์รูปภาพต้องไม่เกิน 2MB");
                    }

                    // แปลงไฟล์เป็น Base64
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]); // เอาแค่ส่วน data
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(file);
                    });

                    payload.fileData = base64Data;
                    payload.fileName = file.name;
                    payload.mimeType = file.type;
                }

                // ส่งข้อมูลไปที่ Apps Script (POST)
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload) // ใช้ JSON.stringify ไม่ได้ส่งเป็น FormData
                });
                
                const result = await response.json();

                if(result.status === 'success') {
                    // ล้างค่าในฟอร์มเมื่อสำเร็จ
                    document.getElementById('expenseForm').reset();
                    
                    // แจ้งเตือนสำเร็จ
                    msgBox.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> บันทึกข้อมูลสำเร็จ!';
                    msgBox.className = 'block text-sm text-center font-medium p-2 rounded mt-2 bg-green-50 text-green-700 border border-green-200';
                    
                    // โหลดข้อมูล Dashboard ใหม่เพื่อแสดงรายการล่าสุด
                    await loadDashboardData();
                } else {
                    throw new Error(result.message || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์");
                }

            } catch (error) {
                // แจ้งเตือนเมื่อเกิด Error (ทั้งจากเซิร์ฟเวอร์หรือ Validation ฝั่ง Client)
                msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ล้มเหลว: ${error.message}`;
                msgBox.className = 'block text-sm text-center font-medium p-2 rounded mt-2 bg-red-50 text-red-700 border border-red-200';
            } finally {
                // คืนค่าปุ่มกลับมาเป็นปกติ
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                
                // ซ่อนข้อความแจ้งเตือนอัตโนมัติหลังผ่านไป 5 วินาที
                setTimeout(() => { if(!msgBox.classList.contains('hidden')) msgBox.classList.add('hidden'); }, 5000);
            }
        });

        // ---------------------------------------------------------
        // 6. เริ่มการทำงานเมื่อหน้าเว็บโหลดเสร็จ
        // ---------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            // เตือนให้ใส่ URL ก่อนใช้งาน
            if(GAS_API_URL === 'YOUR_WEB_APP_URL_HERE') {
                const statusBadge = document.getElementById('api-status');
                statusBadge.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i> กรุณาใส่ Web App URL ในโค้ด';
                statusBadge.className = 'px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium flex items-center';
                return;
            }
            
            // โหลดข้อมูลตั้งต้น
            loadDashboardData();
        });
    </script>
</body>
</html>
